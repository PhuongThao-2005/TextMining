# Ablation configuration schema version 1.
#
# Required top-level keys per config:
#   benchmark: {path, version}
#   corpus: {path, version}
#   retrieval:
#     top_k: positive integer
#     filter_profile: current_law | broad | historical
#     dense: {enabled, backend}
#     sparse/graph/fusion/reranker: {enabled, ...}
#   generation:
#     provider, model, prompt_strategy, temperature, top_p,
#     max_output_tokens, timeout_seconds, max_retries
#   judge: {provider, model?}
#   agent: {enabled, mode?}; modes: none | simple_planner | multi_tool
#   output: {root}
#
# Supported now:
#   dense.backend: faiss | qdrant | hashing
#   generation.provider: reference | gemini | openai_compatible
#   judge.provider: none | gemini
#
# Sparse BM25, RRF fusion, Cross-Encoder reranking and structural graph
# expansion are integrated by the canonical full-stack adapter. Unsupported
# backends/strategies fail validation; the runner never silently substitutes.

schema_version: 1

# Shared official retrieval stack consumed by My's LLM/Agent ablations.  These
# aliases ensure every comparison uses byte-for-byte identical upstream values.
full_stack_components:
  sparse: &full_stack_sparse
    enabled: true
    backend: bm25
    index_path: data/sparse_index
    version: official-bm25-pending
  graph: &full_stack_graph
    enabled: true
    backend: structural_pickle
    path: data/graph/knowledge_graph.gpickle
    version: official-kg-pending
    max_seeds: 3
    max_hop: 2
    max_chunks: 10
  fusion: &full_stack_fusion
    enabled: true
    strategy: rrf
    rrf_k: 60
  reranker: &full_stack_reranker
    enabled: true
    model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1

configs:
  Example-Reference-Hashing:
    benchmark:
      path: data/benchmark/qa_final.jsonl
      version: qa-final-v1
    corpus:
      path: data/v2/documents.jsonl
      version: v2
    retrieval:
      top_k: 5
      filter_profile: broad
      dense:
        enabled: true
        backend: hashing
        model: development-hashing
        score_threshold: 0.0
        expand_units: false
      sparse:
        enabled: false
      graph:
        enabled: false
      fusion:
        enabled: false
      reranker:
        enabled: false
    generation:
      provider: reference
      model: reference
      temperature: 0.0
    judge:
      provider: none
    agent:
      enabled: false
      type: plain_rag
    output:
      root: evaluation_runs/ablation
    seed: 42
    metadata:
      purpose: local plumbing example; not an official benchmark result
      tags:
        - example
        - offline

  # Ablation 1: compare dense indexes built from chunk text only versus
  # metadata header + chunk text. Both configs run the full E2E RAG path with
  # the same generator, prompt, benchmark, corpus, filter, top-k, and decoding.
  Embed-ChunkOnly-Dense:
    benchmark:
      path: data/benchmark/qa_final.jsonl
      version: qa-final-v1
    corpus:
      path: data/v2/documents.jsonl
      version: v2
    retrieval:
      top_k: 5
      filter_profile: broad
      dense:
        enabled: true
        backend: faiss
        index_path: "data/chunk only/faiss_index"
        index_version: chunk-only-faiss-v1
        model: intfloat/multilingual-e5-large
        score_threshold: 0.3
        expand_units: true
        embedded_text: chunk_text_only
      sparse:
        enabled: false
      graph:
        enabled: false
      fusion:
        enabled: false
      reranker:
        enabled: false
    generation:
      provider: openai_compatible
      model: env:LLM_BASE_MODEL
      prompt_strategy: base
      prompt_template_version: legal-grounded-answer-v2-citations
      temperature: 0.0
      top_p: 1.0
      max_output_tokens: 1024
      timeout_seconds: 60.0
      max_retries: 2
      api_key_env: LLM_API_KEY
      base_url_env: LLM_BASE_URL
    judge:
      provider: none
    agent:
      enabled: false
      mode: none
      implementation_status: implemented
    output:
      root: evaluation_runs/ablation
    seed: 42
    metadata:
      purpose: controlled E2E embedding-text ablation
      experiment_family: embedding
      ablation_family: embedding
      embedded_text: chunk_text_only

