  # Production-intent LLM comparison contract. Model selectors use env:NAME so
  # no unverified provider model is hard-coded. The official benchmark and
  # FAISS index paths intentionally fail preflight until those artifacts exist.
  # Controlled 2x2 LLM comparison. Retrieval is fixed across all four cells:
  # Dense FAISS -> Graph -> RRF(Dense, Graph) -> global Cross-Encoder reranker.
  # Sparse/BM25 is deliberately disabled.
  LLM-BaseReasoning:
    benchmark:
      path: data/benchmark/qa_final.jsonl
      version: qa-final-v1
    corpus:
      path: data/v2/documents.jsonl
      version: v2
    retrieval:
      top_k: 5
      filter_profile: broad
      dense:
        enabled: true
        backend: faiss
        index_path: data/faiss_index
        index_version: official-faiss-pending
        model: intfloat/multilingual-e5-large
        score_threshold: 0.3
        expand_units: true
      sparse:
        enabled: false
      graph:
        enabled: true
        backend: structural_pickle
        path: data/graph/knowledge_graph.gpickle
        version: official-graph-pending
        max_hop: 2
        max_context: 30
      fusion:
        enabled: true
        strategy: rrf
        rrf_k: 60
      reranker:
        enabled: true
        backend: cross_encoder
        scope: global
        model: cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
        candidate_limit: 30
    generation:
      provider: openai_compatible
      model: env:LLM_BASE_MODEL
      prompt_strategy: base
      prompt_template_version: legal-grounded-answer-v2-citations
      temperature: 0.0
      top_p: 1.0
      max_output_tokens: 1024
      timeout_seconds: 60.0
      max_retries: 2
      api_key_env: LLM_API_KEY
      base_url_env: LLM_BASE_URL
    judge:
      provider: none
    agent:
      enabled: false
      type: plain_rag
    output:
      root: evaluation_runs/ablation
    seed: 42
    metadata:
      purpose: controlled production-intent LLM ablation; execution pending verified dependencies
      experiment_family: llm-reasoning-model

